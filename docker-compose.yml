services:
  fortnox-mcp:
    image: ghcr.io/sparrner/fortnox-mcp:latest
    restart: unless-stopped
    environment:
      FORTNOX_CLIENT_ID: ${FORTNOX_CLIENT_ID}
      FORTNOX_CLIENT_SECRET: ${FORTNOX_CLIENT_SECRET}
      FORTNOX_REFRESH_TOKEN: ${FORTNOX_REFRESH_TOKEN:-}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
    volumes:
      - /Volume1/data/Filer/portainer/fortnox-mcp:/data
    networks:
      - ai-net

networks:
  ai-net:
    external: true

